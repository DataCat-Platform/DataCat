<div class="logs-table-container">
  <div class="table-scroll">
    <p-table
      (onPage)="onPageChange($event)"
      stripedRows
      [first]="(pagination.page - 1) * pagination.pageSize"
      [paginator]="true"
      [rows]="pagination.pageSize"
      [totalRecords]="pagination.totalCount"
      [value]="logs"
      scrollable="true"
      styleClass="p-datatable-sm"
      [loading]="loading"
    >
      <ng-template pTemplate="header">
        <tr>
          <th (click)="onSort('timestamp')">
            Timestamp
            <i
              *ngIf="currentSortField === 'timestamp'"
              [class.pi-sort-alpha-up]="sortAscending"
              [class.pi-sort-amount-down]="!sortAscending"
              class="pi"
            ></i>
          </th>
          <th (click)="onSort('severity')">
            Severity
            <i
              *ngIf="currentSortField === 'severity'"
              [class.pi-sort-alpha-down]="!sortAscending"
              [class.pi-sort-alpha-up]="sortAscending"
              class="pi"
            ></i>
          </th>
          <th (click)="onSort('serviceName')">
            Service
            <i
              *ngIf="currentSortField === 'serviceName'"
              [class.pi-sort-alpha-down]="!sortAscending"
              [class.pi-sort-alpha-up]="sortAscending"
              class="pi"
            ></i>
          </th>
          <th>Message</th>
          <th>Trace ID</th>
          <th>Details</th>
        </tr>
      </ng-template>
      <ng-template let-log pTemplate="body">
        <tr>
          <td>
            <span class="atomic">{{ log.timestamp | date: 'short' }}</span>
          </td>
          <td>
            <p-tag
              [severity]="getSeverityClass(log.severity)"
              [value]="log.severity"
            />
          </td>
          <td>{{ log.serviceName }}</td>
          <td class="message-cell text-secondary">
            {{ sanitizeMessage(log.message) | slice: 0 : 30
            }}<span
              class="text-secondary"
              [pTooltip]="sanitizeMessage(log.message)"
              >...</span
            >
          </td>
          <td>
            {{ log.traceId | slice: 0 : 6
            }}<span class="text-secondary" [pTooltip]="log.traceId">...</span>
          </td>
          <td>
            <p-button
              (click)="showDetails(log.additionalFields)"
              icon="pi pi-info-circle"
              [text]="true"
              severity="secondary"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
