<div class="traces-table-container">
  <div class="table-scroll">
    <p-table [paginator]="false" [value]="traces" styleClass="ResultList">
      <ng-template pTemplate="header">
        <tr>
          <th>Duration</th>
          <th>Trace</th>
          <th>Spans</th>
          <th>Services</th>
          <th>Time</th>
        </tr>
      </ng-template>
      <ng-template let-trace pTemplate="body">
        <tr>
          <td>
            <div
              [style.width.%]="
                (getCurrentDuration(trace) / getMaxDuration()) * 100
              "
              class="duration-bar"
            ></div>
            <span>{{ getFormattedDuration(getCurrentDuration(trace)) }}</span>
          </td>
          <td>
            <a
              (click)="redirectToTraceDetails(trace.traceId)"
              class="trace-link"
            >
              <small>{{ trace.traceId | slice: 0 : 8 }}</small>
            </a>
          </td>
          <td>
            {{ getSpanCount(trace) }}
          </td>
          <td>
            @for (svc of getTraceServices(trace); track svc) {
              <p-tag [styleClass]="'service-tag'" [value]="svc" severity="info">
              </p-tag>
            }
          </td>
          <td>
            {{ getTracesStartTime(trace) | date: 'h:mm:ss a' }}<br />
            <small class="text-secondary">{{ getTracesTimeAgo(trace) }}</small>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
